# herd.example.toml — herdr workers this repo's lead may drive.
# Copy to <repo>/herd.toml and edit. Peer sessions are NOT listed here:
# every live session under ~/projects is a peer, found with ListAgents.

[[worker]]
name = "reviewer"               # herdr live-agent name: [a-z][a-z0-9_-]{0,31}
kind = "cursor"                 # a kind from `herdr agent` help
role = "cross-lineage reviewer, read-only"
machine = "local"               # "local" or a label from `herdr machine list`
# Reviewer mode; never inherit an implementation worker's --force flag.
args = ["--mode", "ask", "--model", "grok-4.7-high"]

[[worker]]
name = "review-fable"
kind = "claude"
role = "independent read-only peer for an Astra lead"
machine = "local"
args = ["--model", "fable", "--restricted", "--strict-mcp-config", "--tools", "Read,Grep,Glob"]

[[worker]]
name = "review-astra"
kind = "codex"
role = "independent read-only peer for a Claude Fable lead"
machine = "local"
args = ["--model", "gpt-6-astra", "--sandbox", "read-only"]

[[worker]]
name = "implementer"
kind = "devin"
role = "scoped implementation with tests, one plan task per dispatch"
machine = "local"
# Use only for an approved implementation task; edits stay in the workspace.
args = ["--model", "swe-2-max", "--permission-mode", "accept-edits", "--sandbox"]
# command classes the lead may approve on the user's behalf when a dialog
# appears; everything else goes to the user. Absent = nothing pre-approved.
preapproved = ["ls", "cat", "find", "du", "stat", "head", "wc", "git log", "git status"]

[[worker]]
name = "bench"
kind = "codex"
role = "run benchmarks on the remote box, report numbers only"
machine = "gpu-box"
